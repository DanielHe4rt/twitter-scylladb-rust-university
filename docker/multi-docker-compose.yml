services:
  scylla-dc1-n1: &scylla-main-dc1
    image: scylladb/scylla:6.1.1
    container_name: scylla-dc1-n1
    command:
      - --smp=1
      - --memory=1GB
      - --overprovisioned=1
      - --developer-mode=1
      - --seeds=scylla-dc1-n1,scylla-dc2-n1
      - --endpoint-snitch=GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    networks:
      - scylla-dc
    volumes:
      - ./conf/rack-dc1.properties:/etc/scylla/cassandra-rackdc.properties:rw
  scylla-dc1-n2:
    <<: *scylla-main-dc1
    container_name: scylla-dc1-n2
    ports:
      - "9043:9042"
    volumes:
      - ./conf/rack-dc1.properties:/etc/scylla/cassandra-rackdc.properties:rw
    networks:
      - scylla-dc
  scylla-dc1-n3:
    <<: *scylla-main-dc1
    container_name: scylla-dc1-n3
    volumes:
      - ./conf/rack-dc1.properties:/etc/scylla/cassandra-rackdc.properties:rw
    ports:
      - "9044:9042"
    networks:
      - scylla-dc
  scylla-dc2-n1: &scylla-main-dc2
    image: scylladb/scylla:6.1.1
    container_name: scylla-dc2-n1
    command:
      - --smp=1
      - --memory=1GB
      - --overprovisioned=1
      - --developer-mode=1
      - --seeds=scylla-dc1-n1,scylla-dc2-n1
      - --endpoint-snitch=GossipingPropertyFileSnitch
    ports:
      - "9045:9042"
    networks:
      - scylla-dc
    volumes:
      - ./conf/rack-dc2.properties:/etc/scylla/cassandra-rackdc.properties:rw
  scylla-dc2-n2:
    <<: *scylla-main-dc2
    container_name: scylla-dc2-n2
    volumes:
      - ./conf/rack-dc2.properties:/etc/scylla/cassandra-rackdc.properties:rw
    ports:
      - "9046:9042"
    networks:
      - scylla-dc
  scylla-dc2-n3:
    <<: *scylla-main-dc2
    container_name: scylla-dc2-n3
    volumes:
      - ./conf/rack-dc2.properties:/etc/scylla/cassandra-rackdc.properties:rw
    ports:
      - "9047:9042"
    networks:
      - scylla-dc